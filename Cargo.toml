[package]
name = "wutong-cli"
description = "Wutong CLI (`wutong`): local-first document, envelope and signature tooling for the Wutong Protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/project-wutong/wutong-cli"

[[bin]]
name = "wutong"
path = "src/main.rs"

[dependencies]
wutong-core = { git = "https://github.com/project-wutong/wutong-core", branch = "main" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"

[lints.rust]
unsafe_code = "forbid"
